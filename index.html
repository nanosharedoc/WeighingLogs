<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Weighing Self-Report</title>
  <style>
    body{font-family:Tahoma,Arial,sans-serif; background:#f6f7fb; margin:0}
    .wrap{max-width:980px; margin:24px auto; padding:0 14px}
    .card{background:#fff; border:1px solid #e7e7ee; border-radius:14px; padding:16px 16px 8px}
    h1{font-size:18px; margin:0 0 12px}
    h2{font-size:14px; margin:0 0 8px}
    .grid{display:grid; grid-template-columns:repeat(12,1fr); gap:10px}
    .col-12{grid-column:span 12}
    .col-6{grid-column:span 6}
    .col-4{grid-column:span 4}
    .col-3{grid-column:span 3}
    label{display:block; font-size:12px; color:#333; margin:2px 0 6px}
    input,select,textarea{width:100%; padding:10px; border:1px solid #d7d7e3; border-radius:10px; background:#fff}
    .row{display:flex; gap:8px; align-items:center}
    button{padding:10px 14px; border-radius:10px; border:1px solid #2f6fed; background:#2f6fed; color:#fff; cursor:pointer}
    button.secondary{background:#fff; color:#2f6fed}
    .muted{color:#666; font-size:12px}
    .hr{height:1px; background:#eee; margin:10px 0}
    .ok{color:#0a7a2f}
    .err{color:#b00020}
    .warn{color:#b8860b; font-size:12px}
    .live{background:#f0f6ff; border:1px solid #d4e2ff; border-radius:12px; padding:12px}
    .live table{width:100%; border-collapse:collapse; font-size:13px}
    .live td{padding:4px 6px}
    .live td:last-child{font-weight:bold; color:#1c3d8f; text-align:left; direction:ltr}
    .live .none{color:#999; font-weight:normal}
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>ثبت دیجیتال توزین/شستشو</h1>
    <div class="muted">تاریخ میلادی (YYYY-MM-DD) — ثبت در Google Sheet</div>
    <div class="hr"></div>

    <div class="grid">
      <div class="col-3">
        <label>تاریخ توزین (میلادی)</label>
        <input id="WeighingDate" type="date" />
      </div>
      <div class="col-3">
        <label>شیفت</label>
        <select id="Shift">
          <option value="">انتخاب...</option>
          <option>روز</option>
          <option>شب</option>
        </select>
      </div>
      <div class="col-3">
        <label>حوزه فرآیند (Zone)</label>
        <select id="Zone">
          <option value="">انتخاب...</option>
          <option value="Inside">Inside</option>
          <option value="Outside">Outside</option>
        </select>
      </div>
      <div class="col-3">
        <label>محل/سایت</label>
        <select id="Site"><option value="">در حال بارگذاری...</option></select>
      </div>

      <div class="col-4">
        <label>نوع فرآیند (ProcessType)</label>
        <select id="ProcessType"><option value="">ابتدا MasterData...</option></select>
      </div>
      <div class="col-4">
        <label>نام محصول</label>
        <select id="Product"><option value="">در حال بارگذاری...</option></select>
      </div>
      <div class="col-4">
        <label>تعداد بچ</label>
        <input id="BatchCount" type="number" min="1" step="1" placeholder="مثلاً 3" />
      </div>

      <div class="col-6">
        <label>شماره بچ‌ها (با کاما جدا کن)</label>
        <input id="BatchNumbers" placeholder="B24001, B24002, B24003" />
      </div>
      <div class="col-6">
        <label>بچ‌سایز (اختیاری)</label>
        <input id="BatchSize" placeholder="مثلاً 250000 (g) یا 250 (kg)" />
      </div>

      <div class="col-4">
        <label>اپراتور ۱</label>
        <select id="Operator1"><option value="">در حال بارگذاری...</option></select>
      </div>
      <div class="col-4">
        <label>اپراتور ۲</label>
        <select id="Operator2"><option value="">در حال بارگذاری...</option></select>
      </div>
      <div class="col-4">
        <label>توضیح کمکـی ۲ (اگر نیروی کمکی)</label>
        <input id="Helper2Desc" placeholder="مثلاً نام/بخش نیروی کمکی" disabled />
      </div>

      <div class="col-4">
        <label>اپراتور ۳</label>
        <select id="Operator3"><option value="">در حال بارگذاری...</option></select>
      </div>
      <div class="col-4">
        <label>توضیح کمکـی ۳ (اگر نیروی کمکی)</label>
        <input id="Helper3Desc" placeholder="مثلاً نام/بخش نیروی کمکی" disabled />
      </div>

      <div class="col-12"><div class="hr"></div></div>

      <div class="col-4">
        <label>شروع ستاپ</label>
        <input id="SetupStart" type="time" />
      </div>
      <div class="col-4">
        <label>پایان ستاپ</label>
        <input id="SetupEnd" type="time" />
      </div>
      <div class="col-4">
        <label>شروع فرآیند (Main)</label>
        <input id="MainStart" type="time" />
      </div>
      <div class="col-4">
        <label>پایان فرآیند (Main)</label>
        <input id="MainEnd" type="time" />
      </div>
      <div class="col-4">
        <label>شروع شستشو</label>
        <input id="CleaningStart" type="time" />
      </div>
      <div class="col-4">
        <label>پایان شستشو</label>
        <input id="CleaningEnd" type="time" />
      </div>

      <!-- نمایش زندهٔ محاسبات -->
      <div class="col-12">
        <div class="live">
          <h2>محاسبهٔ زنده</h2>
          <table>
            <tr><td>مدت ستاپ</td><td id="outSetup">—</td></tr>
            <tr><td>مدت فرآیند اصلی (خالص)</td><td id="outMain">—</td></tr>
            <tr><td>مدت شستشو</td><td id="outClean">—</td></tr>
            <tr><td>مدت کل</td><td id="outTotal">—</td></tr>
            <tr><td>سهم زمانی هر بچ</td><td id="outPerBatch">—</td></tr>
          </table>
          <div id="timeWarn" class="warn"></div>
        </div>
      </div>

      <div class="col-12">
        <div class="row">
          <button id="btnSubmit">ثبت در شیت</button>
          <button id="btnInit" class="secondary" type="button">ساخت/آپدیت هدرها</button>
          <span id="msg" class="muted"></span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // 1) لینک Web App خودت را جایگزین کن
  const SCRIPT_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE";

  const $ = (id) => document.getElementById(id);

  async function post_(payload){
    const res = await fetch(SCRIPT_URL, {
      method: "POST",
      headers: {"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify(payload)
    });
    return await res.json();
  }

  function setMsg(text, type){
    const el = $("msg");
    el.textContent = text || "";
    el.className = type === "ok" ? "ok" : type === "err" ? "err" : "muted";
  }

  function fillSelect(id, items){
    const sel = $(id);
    sel.innerHTML = `<option value="">انتخاب...</option>` + items.map(x => `<option>${escapeHtml_(x)}</option>`).join("");
  }

  function escapeHtml_(s){
    return String(s).replace(/[&<>"']/g, (m)=>({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
    }[m]));
  }

  function toggleHelperDesc(selectId, inputId){
    const sel = $(selectId);
    const inp = $(inputId);
    const isHelper = (sel.value || "").trim() === "Nirooye Komaki";
    inp.disabled = !isHelper;
    if(!isHelper) inp.value = "";
  }

  // ---------- محاسبات زمانی ----------
  // تفاضل دو ساعت با پشتیبانی عبور از نیمه‌شب.
  // خروجی: {minutes, crossedMidnight} یا null اگر ورودی ناقص باشد.
  function diffMinutes_(start, end){
    if(!start || !end) return null;
    const [sh, sm] = start.split(":").map(Number);
    const [eh, em] = end.split(":").map(Number);
    const s = sh * 60 + sm;
    let e = eh * 60 + em;
    let crossed = false;
    if(e < s){ e += 24 * 60; crossed = true; } // عبور از نیمه‌شب
    return { minutes: e - s, crossedMidnight: crossed };
  }

  // نمایش دقیقه به شکل "2 ساعت و 35 دقیقه"
  function fmt_(m){
    if(m === null) return null;
    const h = Math.floor(m / 60), mm = m % 60;
    return (h > 0 ? h + " ساعت و " : "") + mm + " دقیقه";
  }

  function recalcLive(){
    const setup = diffMinutes_($("SetupStart").value, $("SetupEnd").value);
    const main  = diffMinutes_($("MainStart").value, $("MainEnd").value);
    const clean = diffMinutes_($("CleaningStart").value, $("CleaningEnd").value);

    const hasAny = setup !== null || main !== null || clean !== null;
    const set = (id, v) => { $(id).innerHTML = v !== null ? escapeHtml_(v) : '<span class="none">—</span>'; };

    if(!hasAny){
      ["outSetup","outMain","outClean","outTotal","outPerBatch"].forEach(id => $(id).innerHTML = '<span class="none">—</span>');
      $("timeWarn").textContent = "";
      return;
    }

    set("outSetup", fmt_(setup ? setup.minutes : null));
    set("outMain",  fmt_(main  ? main.minutes  : null));
    set("outClean", fmt_(clean ? clean.minutes : null));

    const total = (setup ? setup.minutes : 0) + (main ? main.minutes : 0) + (clean ? clean.minutes : 0);
    set("outTotal", fmt_(hasAny ? total : null));

    // توزیع زمان کل بین بچ‌ها (منطق T/N)
    const n = Number($("BatchCount").value);
    if(n >= 1 && total > 0){
      const per = total / n;
      set("outPerBatch", fmt_(Math.round(per)) + ` (کل ÷ ${n})`);
    } else {
      set("outPerBatch", null);
    }

    // هشدار عبور از نیمه‌شب
    const warns = [];
    if(setup && setup.crossedMidnight) warns.push("ستاپ از نیمه‌شب گذشته در نظر گرفته شد.");
    if(main  && main.crossedMidnight)  warns.push("فرآیند اصلی از نیمه‌شب گذشته در نظر گرفته شد.");
    if(clean && clean.crossedMidnight) warns.push("شستشو از نیمه‌شب گذشته در نظر گرفته شد.");
    $("timeWarn").textContent = warns.join(" ");
  }

  async function loadMaster(){
    setMsg("در حال خواندن MasterData ...");
    const r = await post_({action:"getMasterData"});
    if(!r.ok) throw new Error(r.error || "MasterData error");
    const d = r.data;

    fillSelect("Site", d.Sites);
    fillSelect("Product", d.Products);
    fillSelect("Operator1", d.Operators);
    fillSelect("Operator2", d.Operators);
    fillSelect("Operator3", d.Operators);

    // ProcessType براساس Zone
    $("Zone").addEventListener("change", ()=>{
      const z = $("Zone").value;
      if(z === "Inside") fillSelect("ProcessType", d.InsideProcesses);
      else if(z === "Outside") fillSelect("ProcessType", d.OutsideProcesses);
      else $("ProcessType").innerHTML = `<option value="">انتخاب...</option>`;
    });

    setMsg("MasterData لود شد.", "ok");
  }

  function collectData(){
    // محاسبات زنده برای ذخیره در شیت
    const setup = diffMinutes_($("SetupStart").value, $("SetupEnd").value);
    const main  = diffMinutes_($("MainStart").value, $("MainEnd").value);
    const clean = diffMinutes_($("CleaningStart").value, $("CleaningEnd").value);
    const total = (setup ? setup.minutes : 0) + (main ? main.minutes : 0) + (clean ? clean.minutes : 0);
    const n = Number($("BatchCount").value);

    return {
      Timestamp: new Date().toISOString(),
      WeighingDate: $("WeighingDate").value,
      Zone: $("Zone").value,
      Site: $("Site").value,
      Shift: $("Shift").value,
      ProcessType: $("ProcessType").value,
      Product: $("Product").value,
      BatchCount: $("BatchCount").value,
      BatchNumbers: $("BatchNumbers").value,
      BatchSize: $("BatchSize").value,
      Operator1: $("Operator1").value,
      Operator2: $("Operator2").value,
      Helper2Desc: $("Helper2Desc").value,
      Operator3: $("Operator3").value,
      Helper3Desc: $("Helper3Desc").value,

      // زمان‌های خام
      SetupStart: $("SetupStart").value,
      SetupEnd: $("SetupEnd").value,
      MainStart: $("MainStart").value,
      MainEnd: $("MainEnd").value,
      CleaningStart: $("CleaningStart").value,
      CleaningEnd: $("CleaningEnd").value,

      // نتایج محاسبه‌شده
      SetupDuration: setup ? setup.minutes : "",
      MainDuration: main ? main.minutes : "",
      CleaningDuration: clean ? clean.minutes : "",
      TotalDuration: total || "",
      TimePerBatch: (n >= 1 && total > 0) ? (total / n).toFixed(1) : ""
    };
  }

  function basicValidate_(d){
    if(!d.WeighingDate) return "تاریخ را وارد کن.";
    if(!d.Shift) return "شیفت را انتخاب کن.";
    if(!d.Zone) return "Zone را انتخاب کن.";
    if(!d.Site) return "سایت را انتخاب کن.";
    if(!d.ProcessType) return "نوع فرآیند را انتخاب کن.";
    if(!d.Operator1) return "اپراتور ۱ الزامی است.";

    // اگر فرآیند توزین است، تعداد بچ و شماره بچ‌ها را اجباری کنیم (قابل توسعه)
    if(String(d.ProcessType).includes("توزین")) {
      if(!d.BatchCount || Number(d.BatchCount) < 1) return "تعداد بچ را درست وارد کن.";
      if(!d.BatchNumbers) return "شماره بچ‌ها را وارد کن.";
    }
    return "";
  }

  $("Operator2").addEventListener("change", ()=>toggleHelperDesc("Operator2","Helper2Desc"));
  $("Operator3").addEventListener("change", ()=>toggleHelperDesc("Operator3","Helper3Desc"));

  // محاسبهٔ زنده: با هر تغییر در زمان‌ها و تعداد بچ
  ["SetupStart","SetupEnd","MainStart","MainEnd","CleaningStart","CleaningEnd","BatchCount"]
    .forEach(id => $(id).addEventListener("input", recalcLive));
  ["SetupStart","SetupEnd","MainStart","MainEnd","CleaningStart","CleaningEnd"]
    .forEach(id => $(id).addEventListener("change", recalcLive));

  $("btnInit").addEventListener("click", async ()=>{
    try{
      setMsg("در حال ساخت/آپدیت شیت‌ها...");
      const r = await post_({action:"initSheets"});
      if(!r.ok) throw new Error(r.error || "init error");
      setMsg("هدرها و MasterData آماده شد.", "ok");
      await loadMaster();
    }catch(e){ setMsg(e.message, "err"); }
  });

  $("btnSubmit").addEventListener("click", async (ev)=>{
    ev.preventDefault();
    try{
      const d = collectData();
      const v = basicValidate_(d);
      if(v) { setMsg(v, "err"); return; }

      setMsg("در حال ارسال...");
      const r = await post_({action:"appendLog", data: d});
      if(!r.ok) throw new Error(r.error || "save error");

      setMsg(`ثبت شد. ردیف: ${r.appendedAtRow}`, "ok");
    }catch(e){
      setMsg(e.message, "err");
    }
  });

  // شروع
  loadMaster().catch(e => setMsg(e.message, "err"));
</script>
</body>
</html>
